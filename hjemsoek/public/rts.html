<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTS Stronghold Prototype</title>
    <link rel="stylesheet" href="./rts.css" />
  </head>
  <body>
    <div id="three"></div>
    <div id="reticle" class="reticle" aria-hidden="true"></div>
    <div id="menu" class="menu is-visible">
      <section class="menu-panel" aria-label="RTS menu">
        <h1>RTS</h1>
        <div class="menu-actions">
          <button id="enterCamera" type="button">Enter Camera mode</button>
          <button id="enterCommander" type="button">Enter RTS mode</button>
        </div>
      </section>
    </div>
    <div id="resourceHud" class="rts-ui resource-hud" aria-label="Resources" hidden>
      <span class="resource-item">💰 Money <strong id="moneyValue">10000</strong></span>
      <span class="resource-item">💎 Crystals <strong id="crystalsValue">2000</strong></span>
      <span class="resource-item">👷🏻 Workers <strong id="workersValue">0 / 10</strong></span>
    </div>
    <section
      id="commandPanel"
      class="rts-ui command-panel"
      aria-label="Selected unit commands"
      hidden
    >
      <div id="commandTitle" class="panel-heading">Selection</div>
      <div id="commandStatus" class="command-status"></div>
      <div id="commandGrid" class="command-grid" aria-label="Command grid"></div>
    </section>
    <section
      id="queuePanel"
      class="rts-ui queue-panel"
      aria-label="Production queue"
      hidden
    >
      <div class="queue-heading">
        <span>Production queue</span>
        <strong id="queueCount">0 / 10</strong>
      </div>
      <div id="queueSlots" class="queue-slots" aria-hidden="true"></div>
      <div class="queue-progress" aria-hidden="true">
        <div id="queueProgressFill" class="queue-progress-fill"></div>
      </div>
    </section>
    <div id="selectionBox" class="selection-box" hidden></div>
    <script type="module" src="./rts.js"></script>
  </body>
</html>
